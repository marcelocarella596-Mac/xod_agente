<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maple Core · Protocolo motivacional v1</title><style>body{font-family:system-ui;background:#101827;color:#eef2ff;margin:0;padding:24px}main{max-width:850px;margin:auto}section{background:#1d2940;border-radius:16px;padding:20px;margin:16px 0}button,select,textarea{font:inherit;border-radius:9px;padding:10px;margin:5px;background:#e8ecff;color:#152037;border:0}button{cursor:pointer}textarea{width:95%;height:85px}#salida{white-space:pre-wrap;line-height:1.6}small{color:#bbc7dc}</style></head><body><main><h1>Maple Core · Resonancia comunicacional empática</h1><p>Prototipo local v1: acompañamiento motivacional contextual, sin inferir emociones como hechos.</p><section><label>Momento / intención <select id="estado"><option value="auto">Sugerir según horario</option><option value="amanecer">Amanecer</option><option value="foco">Foco</option><option value="pausa">Pausa</option><option value="impulso">Impulso</option><option value="atardecer">Atardecer</option></select></label><p><label>¿Qué querés abordar? (opcional)</label></p><textarea id="contexto" placeholder="Por ejemplo: quiero ordenar las tareas de hoy"></textarea><p><button id="generar">Generar acompañamiento</button><button id="hablar">Escuchar</button><button id="detener">Detener voz</button><button id="guardar">Guardar nota local</button></p><small>La voz depende de las voces disponibles en tu navegador. No graba ni transmite audio.</small></section><section><h2>Respuesta Maple</h2><div id="salida" aria-live="polite"></div></section><section><h2>Bitácora local</h2><button id="exportar">Exportar JSON</button><button id="borrar">Borrar bitácora</button><div id="historial"></div></section></main><script>
const $=id=>document.getElementById(id);const clave='maple_core_motivacional_v1';let actual='';const modelos={amanecer:['Buen día. Podemos empezar con tranquilidad, sin llenar la mañana de exigencias.','Elegí una prioridad concreta y un primer paso posible.'],foco:['Vamos a concentrarnos en una cosa por vez.','Definí qué resultado querés conseguir y qué acción pequeña lo acerca.'],pausa:['Podemos hacer una pausa breve y volver con otra perspectiva.','Si te sirve, soltá la pantalla un momento y decidí después qué retomar.'],impulso:['Si algo se trabó, podemos revisar el camino sin convertirlo en una derrota.','Identifiquemos el obstáculo y probemos una alternativa concreta.'],atardecer:['Podemos cerrar el día reconociendo lo que sí avanzó.','Anotá un aprendizaje y dejá una prioridad preparada para mañana.']};function sugerir(){const h=new Date().getHours();return h<11?'amanecer':h<14?'foco':h<17?'pausa':h<20?'impulso':'atardecer'}function crear(){const tipo=$('estado').value==='auto'?sugerir():$('estado').value;const c=$('contexto').value.trim();const [a,b]=modelos[tipo];actual=a+(c?'\n\nSobre lo que mencionaste («'+c+'»), podemos pensar una acción que dependa de vos, sin suponer cómo te sentís.':'')+'\n\n'+b+'\n\n¿Querés que lo resolvamos juntos o preferís simplemente conversar?';$('salida').textContent=actual;return tipo}function leer(){if(!actual)crear();if(!('speechSynthesis'in window)){alert('Este navegador no admite voz sintetizada.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(actual);u.lang='es-AR';u.rate=.92;u.pitch=.95;const voces=speechSynthesis.getVoices();u.voice=voces.find(v=>v.lang.toLowerCase()==='es-ar')||voces.find(v=>v.lang.toLowerCase().startsWith('es'))||null;speechSynthesis.speak(u)}function registros(){try{return JSON.parse(localStorage.getItem(clave)||'[]')}catch{return []}}function pintar(){const items=registros();$('historial').textContent=items.length?items.slice(-10).reverse().map(x=>new Date(x.fecha).toLocaleString('es-AR')+' · '+x.estado+' · '+x.contexto).join('\n'):'Todavía no hay notas.';$('historial').style.whiteSpace='pre-wrap'}$('generar').onclick=crear;$('hablar').onclick=leer;$('detener').onclick=()=>speechSynthesis.cancel();$('guardar').onclick=()=>{const tipo=crear();const items=registros();items.push({fecha:new Date().toISOString(),estado:tipo,contexto:$('contexto').value,respuesta:actual});localStorage.setItem(clave,JSON.stringify(items));pintar()};$('exportar').onclick=()=>{const blob=new Blob([JSON.stringify(registros(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='maple_bitacora.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('borrar').onclick=()=>{if(confirm('¿Borrar la bitácora guardada en este navegador?')){localStorage.removeItem(clave);pintar()}};crear();pintar();
</script></body></html>
